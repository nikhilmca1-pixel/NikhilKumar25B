<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ShopEase</title><link rel="stylesheet" href="style.css"></head><body><header><h1>ShopEase</h1><nav><a href="#shop">Shop</a><a href="#cart">Cart (<span id="count">0</span>)</a><a href="#orders">Orders</a><a href="#seller">Seller Panel</a></nav></header><main><section id="shop"><h2>All Products</h2><div id="products" class="grid"></div></section><section id="cart"><h2>Your Cart</h2><div id="cartItems"></div><p id="total"></p><label>Payment method <select id="payment"><option value="Demo UPI">Demo UPI</option><option value="Demo Card">Demo Card</option><option value="Cash on Delivery">Cash on Delivery</option></select></label><button id="checkout">Place Order</button><p class="note">Demo checkout only — no real payment is processed.</p></section><section id="orders"><h2>Successful Orders</h2><div id="orderList"></div></section><section id="seller"><h2>Seller Master Panel</h2><form id="productForm"><input id="pid" type="hidden"><input id="pname" placeholder="Product name" required><input id="price" type="number" min="1" placeholder="Price" required><input id="stock" type="number" min="0" placeholder="Stock" required><input id="desc" placeholder="Description" required><button>Save Product</button><button type="button" id="reset">Clear</button></form><div id="sellerList"></div></section></main><script src="app.js"></script></body></html>
