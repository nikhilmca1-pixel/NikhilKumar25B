<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Product Dashboard</title><link rel="stylesheet" href="style.css"></head><body><header><h1>Product Dashboard</h1><p>Products fetched from Express API</p></header><main><form id="form"><h2>Add Product</h2><input id="name" placeholder="Product name" required><input id="price" type="number" min="0" placeholder="Price" required><input id="rating" type="number" min="0" max="5" step=".1" placeholder="Rating (0–5)" required><button>Add Product</button></form><h2>All Products</h2><section id="products" class="grid"></section><p id="message"></p></main><script src="app.js"></script></body></html>
