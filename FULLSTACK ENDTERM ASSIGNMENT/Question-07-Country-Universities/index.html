<!-- # Question 7

Create a website where users can enter a country, and the platform will showcase a list of universities, including their names, websites, and corresponding states, all Data fetched through an API.
 -->

<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>University Finder</title><link rel="stylesheet" href="style.css"></head><body><header><h1>University Finder</h1><p>Find universities around the world by country</p></header><main><form id="searchForm"><input id="country" value="India" placeholder="Enter country name" required><button>Search Universities</button></form><p id="message">Enter a country to begin.</p><div class="table-wrap"><table><thead><tr><th>#</th><th>University</th><th>Website</th><th>State / Province</th></tr></thead><tbody id="results"></tbody></table></div></main><script src="script.js"></script></body></html>
